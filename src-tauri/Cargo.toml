[package]
name = "opencode-cleaner"
version = "1.0.0"
description = "Disk usage cleaner for opencode"
authors = ["opencode-cleaner"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "opencode_cleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.32"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "io-util", "macros"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tar = "0.4"
flate2 = "1"
dirs = "5"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
# Per-volume free space via GetDiskFreeSpaceExW (no PowerShell spawn).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
